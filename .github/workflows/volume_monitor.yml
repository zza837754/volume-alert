name: Binance Volume Monitor

on:
  # 已经改用 cron-job.org 每5分钟从外部主动触发(workflow_dispatch)，
  # 不再需要 GitHub 自己的 schedule 定时器，两个同时开会导致触发频率翻倍、
  # 任务排队积压，所以这里把 schedule 去掉，只保留 workflow_dispatch。
  workflow_dispatch: {}

permissions:
  contents: write   # 需要写权限，才能把"检查记录"提交回仓库，避免重复推送

concurrency:
  group: volume-monitor
  cancel-in-progress: true   # 如果上一次还没跑完，新的触发直接顶替旧的排队任务，
                              # 而不是无限堆积在队列里(之前 false 导致积压卡死)

jobs:
  check-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 5        # 防止某次运行卡住不退出，占着队列不放
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 运行监控脚本
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: python volume_alert.py

      - name: 保存检查记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_news_ids.txt seen_volume_ts.txt
          git diff --cached --quiet || git commit -m "更新检查记录"
          git pull --rebase origin main
          git push

