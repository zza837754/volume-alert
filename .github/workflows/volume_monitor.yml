name: Binance Volume Monitor

on:
  schedule:
    # 每5分钟触发一次（GitHub 实际执行可能有几分钟延迟，属于正常现象）
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # 允许你在网页上手动点一下立即运行，方便测试

permissions:
  contents: write   # 需要写权限，才能把"已推送新闻记录"提交回仓库，避免重复推送

concurrency:
  group: volume-monitor
  cancel-in-progress: false   # 同一时间只允许一次运行，排队执行，避免互相抢着推送产生冲突

jobs:
  check-volume:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 运行监控脚本
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: python volume_alert.py

      - name: 保存检查记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_news_ids.txt seen_volume_ts.txt
          git diff --cached --quiet || git commit -m "更新检查记录"
          git pull --rebase origin main
          git push
