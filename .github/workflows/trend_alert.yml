name: trend_alert
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trend_alert
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python trend_alert.py
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_WEBHOOK_TREND: ${{ secrets.DINGTALK_WEBHOOK_TREND }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "update trend state" || true
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
